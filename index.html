<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khorcha - Offline BDT Money Manager</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Khorcha","short_name":"Khorcha","start_url":".","display":"standalone","background_color":"#09090b","theme_color":"#09090b","icons":[{"src":"https://placehold.co/192x192/18181b/ffffff?text=৳","sizes":"192x192","type":"image/png"},{"src":"https://placehold.co/512x512/18181b/ffffff?text=৳","sizes":"512x512","type":"image/png"}]}'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-color: #09090b;
            --surface: #18181b;
            --surface-accent: #27272a;
            --emerald: #10b981;
            --rose: #f43f5e;
            --primary: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: #fafafa;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            font-size: 16px;
        }

        /* Glassmorphism & Depth */
        .premium-glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .premium-card {
            background: var(--surface);
            border: 1px solid var(--surface-accent);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Responsive Sidebar/Grid */
        @media (min-width: 768px) {
            .app-shell {
                display: grid;
                grid-template-columns: 320px 1fr;
                height: 100vh;
            }
            .main-scrollable {
                overflow-y: auto;
                scrollbar-width: none;
            }
        }

        .nav-link.active {
            background: white;
            color: black;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        /* Standardized Calculator UI */
        .calc-key {
            @apply flex items-center justify-center rounded-2xl text-xl font-bold transition-all active:scale-90 select-none aspect-square md:aspect-auto h-14 md:h-16;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .calc-key-op {
            background: rgba(255, 255, 255, 0.1);
            color: var(--emerald);
        }

        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .folder-content {
            transition: all 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .folder-open .folder-content {
            max-height: 1000px;
            opacity: 1;
            padding-top: 1rem;
        }
        .folder-chevron { transition: transform 0.3s ease; }
        .folder-open .folder-chevron { transform: rotate(180deg); }

        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .noscroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="app" class="app-shell">

    <input type="file" id="csv-upload-field" class="hidden" accept=".csv" onchange="handleCSVSelect(event)">

    <script>
        const DB_KEYS = {
            transactions: 'khorcha_app_v11_trans',
            categories: 'khorcha_app_v11_cats',
            accounts: 'khorcha_app_v11_accs',
            debts: 'khorcha_app_v11_debts',
            budgets: 'khorcha_app_v11_budgets',
            notes: 'khorcha_app_v11_notes'
        };

        let state = {
            transactions: JSON.parse(localStorage.getItem(DB_KEYS.transactions)) || [],
            categories: JSON.parse(localStorage.getItem(DB_KEYS.categories)) || [
                { id: '1', name: 'Food & Dining', type: 'expense' },
                { id: '2', name: 'Transport', type: 'expense' },
                { id: '3', name: 'Primary Salary', type: 'income' }
            ],
            accounts: JSON.parse(localStorage.getItem(DB_KEYS.accounts)) || [
                { id: '1', name: 'Cash' },
                { id: '2', name: 'Main Bank' }
            ],
            debts: JSON.parse(localStorage.getItem(DB_KEYS.debts)) || [],
            budgets: JSON.parse(localStorage.getItem(DB_KEYS.budgets)) || {}, 
            notes: JSON.parse(localStorage.getItem(DB_KEYS.notes)) || [],
            viewDate: new Date(),
            dashboardMode: 'monthly',
            currentTab: 'dashboard',
            statFilter: 'monthly',
            qCalcValue: '0',
            fullCalcValue: '0',
            transType: 'expense',
            setupContext: 'cat',
            setupBehavior: 'expense',
            editingId: null
        };

        // Track chart instances to prevent canvas reuse errors
        let chartInstances = {};

        window.onload = () => { 
            registerOfflineServiceWorker();
            renderView(); 
            updateHeaderDates(); 
            lucide.createIcons(); 
            document.getElementById('t-date').valueAsDate = new Date(); 
        };

        function registerOfflineServiceWorker() {
            // Ensure we only attempt registration under valid HTTPS / Localhost origins and not Blob URLs
            const isSupportedProtocol = (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
            const isBlobUrl = window.location.href.startsWith('blob:');

            if ('serviceWorker' in navigator && isSupportedProtocol && !isBlobUrl) {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => {
                        console.log('Service Worker registered with scope:', reg.scope);
                        
                        const showBadges = () => {
                            document.getElementById('offline-badge-pc')?.classList.remove('hidden');
                            document.getElementById('offline-badge-mobile')?.classList.remove('hidden');
                        };

                        if (reg.active) {
                            showBadges();
                        }

                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showBadges();
                                }
                            };
                        };
                    })
                    .catch((err) => {
                        console.warn('Service Worker registration skipped or failed:', err);
                    });
            } else {
                console.log('Service Worker registration skipped: Running in preview or non-standard environment.');
            }
        }

        function updateHeaderDates() { 
            const dStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            if(document.getElementById('header-date')) document.getElementById('header-date').innerText = dStr; 
            if(document.getElementById('pc-date')) document.getElementById('pc-date').innerText = dStr; 
        }

        function formatBDT(num) { return '৳' + Number(Math.round(num)).toLocaleString('en-IN', { minimumFractionDigits: 0 }); }

        function switchTab(tab) {
            state.currentTab = tab;
            renderView();
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const mobileBtn = document.getElementById(`nav-${tab}`);
            const pcBtn = document.getElementById(`pc-nav-${tab}`);
            if(mobileBtn) mobileBtn.classList.add('active');
            if(pcBtn) pcBtn.classList.add('active');
        }

        function renderView() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'budget': renderBudget(container); break;
                case 'stats': renderStats(container); break;
                case 'notes': renderNotes(container); break;
                case 'calculator': renderCalculator(container); break;
                case 'settings': renderSettings(container); break;
            }
            lucide.createIcons();
        }

        function renderDashboard(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const filtered = state.transactions.filter(t => state.dashboardMode === 'all' || (new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y));
            let periodInc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            let periodExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            let totalBal = state.transactions.reduce((s, t) => t.type === 'income' ? s + parseFloat(t.amount) : s - parseFloat(t.amount), 0);

            el.innerHTML = `
                <div class="premium-glass rounded-[3rem] p-10 md:p-16 mb-12 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-16 relative z-10">
                        <div class="flex bg-black/40 p-1.5 rounded-full border border-white/5">
                            <button onclick="toggleDashboard('monthly')" class="px-6 py-2 rounded-full text-[10px] font-black uppercase ${state.dashboardMode === 'monthly' ? 'bg-white text-black shadow-xl' : 'text-zinc-500'}">Month</button>
                            <button onclick="toggleDashboard('all')" class="px-6 py-2 rounded-full text-[10px] font-black uppercase ${state.dashboardMode === 'all' ? 'bg-white text-black shadow-xl' : 'text-zinc-500'}">Lifetime</button>
                        </div>
                        ${state.dashboardMode === 'monthly' ? `<div class="flex items-center gap-6"><button onclick="changeMonth(-1)" class="p-2 text-white hover:bg-white/5 rounded-full"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><span class="text-xs font-black uppercase text-zinc-400">${state.viewDate.toLocaleString('default', { month: 'short', year: 'numeric' })}</span><button onclick="changeMonth(1)" class="p-2 text-white hover:bg-white/5 rounded-full"><i data-lucide="chevron-right" class="w-6 h-6"></i></button></div>` : ''}
                    </div>

                    <div class="text-center relative z-10 mb-16">
                        <p class="text-zinc-500 text-xs font-black uppercase tracking-[0.4em] mb-4">Account Liquidity</p>
                        <h2 class="text-6xl md:text-8xl font-black tracking-tighter text-white drop-shadow-2xl">${formatBDT(totalBal)}</h2>
                        <p class="mt-6 text-sm font-bold text-zinc-600 uppercase tracking-widest">Period Cashflow: ${formatBDT(periodInc - periodExp)}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                        <div class="bg-emerald-500/5 p-8 rounded-[2.5rem] border border-emerald-500/10"><p class="text-[10px] text-emerald-500/60 font-black mb-2 uppercase tracking-widest">Total Received</p><p class="text-3xl font-black text-emerald-400">+${formatBDT(periodInc)}</p></div>
                        <div class="bg-rose-500/5 p-8 rounded-[2.5rem] border border-rose-500/10"><p class="text-[10px] text-rose-500/60 font-black mb-2 uppercase tracking-widest">Total Spent</p><p class="text-3xl font-black text-rose-400">-${formatBDT(periodExp)}</p></div>
                    </div>
                </div>

                <div class="space-y-12">
                    <h3 class="text-xl font-black tracking-tight text-zinc-400 px-2">Recent Timeline</h3>
                    <div class="grid grid-cols-1 gap-12">${renderGroupedList(filtered)}</div>
                </div>
            `;
        }

        function renderBudget(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const monthKey = `${m}-${y}`;
            const monthBudgets = state.budgets[monthKey] || {};
            const monthName = state.viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const currentMonthTrans = state.transactions.filter(t => new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y);
            const incomeCats = state.categories.filter(c => c.type === 'income');
            const expenseCats = state.categories.filter(c => c.type === 'expense');
            const debtCats = state.debts;

            let totalPlInc = incomeCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlExp = expenseCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlDebt = debtCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            const rem = totalPlInc - totalPlExp - totalPlDebt;

            el.innerHTML = `
                <div class="space-y-12 pb-20">
                    <div class="premium-glass rounded-[3rem] p-12 md:p-16">
                        <div class="flex justify-between items-center mb-12">
                            <h2 class="text-3xl font-black tracking-tighter text-white">Monthly Plan</h2>
                            <div class="flex items-center gap-6"><button onclick="changeMonth(-1)" class="p-2 text-white"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><span class="text-xs font-black uppercase text-zinc-500">${monthName}</span><button onclick="changeMonth(1)" class="p-2 text-white"><i data-lucide="chevron-right" class="w-6 h-6"></i></button></div>
                        </div>
                        <div class="text-center">
                            <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.3em] mb-4">Left to Allocate</p>
                            <h2 id="budget-summary-val" class="text-6xl font-black tracking-tighter ${rem === 0 ? 'text-emerald-400' : 'text-white'}">${formatBDT(rem)}</h2>
                            <p id="budget-summary-hint" class="text-xs font-bold text-zinc-600 mt-6 tracking-widest uppercase">${rem === 0 ? "Every Taka has a job!" : "Goal: Bring this to zero."}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-12">
                        <section class="space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-emerald-500/60 px-4">Income Streams</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${incomeCats.map(c => renderBudgetItem(c, monthBudgets[c.id], currentMonthTrans)).join('')}</div>
                        </section>
                        <section class="space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-rose-500/60 px-4">Debt Clearance</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${debtCats.map(d => renderDebtBudgetItem(d, monthBudgets[d.id], state.transactions)).join('')}</div>
                        </section>
                        <section class="space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-zinc-500 px-4">Spending Groups</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${expenseCats.map(c => renderBudgetItem(c, monthBudgets[c.id], currentMonthTrans)).join('')}</div>
                        </section>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderBudgetItem(cat, planned, trans) {
            const isInc = cat.type === 'income';
            const act = trans.filter(t => t.category === cat.name).reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            const plVal = parseFloat(planned) || 0;
            const diff = plVal - act;
            const progress = plVal > 0 ? Math.min((act / plVal) * 100, 100) : 0;
            let barCol = isInc ? (act >= plVal ? 'bg-emerald-400' : 'bg-zinc-700') : (act > plVal ? 'bg-rose-400' : 'bg-white');

            return `
                <div class="premium-card p-8 rounded-[2.5rem]">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <p class="text-sm font-black uppercase tracking-wider text-white">${cat.name}</p>
                            <p id="rem-val-${cat.id}" class="text-[10px] text-zinc-500 font-bold uppercase mt-2">${isInc ? (diff > 0 ? 'To Receive' : 'Surplus') : (diff >= 0 ? 'Remaining' : 'Overspent')}: ${formatBDT(Math.abs(diff))}</p>
                        </div>
                        <div class="bg-black/40 px-4 py-2 rounded-xl border border-white/5"><input type="number" value="${planned || ''}" placeholder="0" oninput="updateBudget('${cat.id}', this.value)" class="bg-transparent text-sm font-black text-white w-20 text-right outline-none"></div>
                    </div>
                    <div class="progress-bar mb-3"><div id="prog-val-${cat.id}" class="progress-fill ${barCol}" style="width: ${progress}%"></div></div>
                    <div class="flex justify-between items-center text-[9px] font-black uppercase tracking-widest text-zinc-600"><span>${isInc ? 'Got' : 'Used'}: ${formatBDT(act)}</span><span id="plan-val-${cat.id}">Plan: ${formatBDT(plVal)}</span></div>
                </div>
            `;
        }

        function updateBudget(catId, val) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const monthKey = `${m}-${y}`;
            if (!state.budgets[monthKey]) state.budgets[monthKey] = {};
            state.budgets[monthKey][catId] = val;
            saveAll();

            // Perform targeted calculations to update top summary header live
            const monthBudgets = state.budgets[monthKey];
            const incomeCats = state.categories.filter(c => c.type === 'income');
            const expenseCats = state.categories.filter(c => c.type === 'expense');
            const debtCats = state.debts;

            let totalPlInc = incomeCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlExp = expenseCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlDebt = debtCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            const rem = totalPlInc - totalPlExp - totalPlDebt;

            const summaryEl = document.getElementById('budget-summary-val');
            const hintEl = document.getElementById('budget-summary-hint');
            if (summaryEl) {
                summaryEl.innerText = formatBDT(rem);
                summaryEl.className = `text-6xl font-black tracking-tighter ${rem === 0 ? 'text-emerald-400' : 'text-white'}`;
            }
            if (hintEl) {
                hintEl.innerText = rem === 0 ? "Every Taka has a job!" : "Goal: Bring this to zero.";
            }
        }

        function renderDebtBudgetItem(debt, planned, allTrans) {
            const totalPaid = allTrans.filter(t => t.category === debt.name && t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
            const remaining = Math.max(0, parseFloat(debt.initialBalance) - totalPaid);
            return `
                <div class="premium-card p-8 rounded-[2.5rem]">
                    <div class="flex justify-between items-start mb-8">
                        <div><p class="text-sm font-black uppercase tracking-widest text-white">${debt.name}</p><p class="text-[10px] text-rose-400/60 font-bold uppercase mt-2">Still Owed: ${formatBDT(remaining)}</p></div>
                        <div class="bg-black/40 px-4 py-2 rounded-xl border border-white/5"><input type="number" value="${planned || ''}" placeholder="0" oninput="updateBudget('${debt.id}', this.value)" class="bg-transparent text-sm font-black text-white w-20 text-right outline-none"></div>
                    </div>
                    <div class="progress-bar mb-3"><div class="progress-fill bg-rose-400" style="width: ${Math.min((totalPaid / debt.initialBalance) * 100, 100)}%"></div></div>
                    <div class="flex justify-between items-center text-[9px] font-black uppercase tracking-widest text-zinc-600"><span>Cleared: ${formatBDT(totalPaid)}</span><span>Payment Goal: ${formatBDT(parseFloat(planned)||0)}</span></div>
                </div>
            `;
        }

        function renderGroupedList(list) {
            const groups = {}; list.forEach(t => { if(!groups[t.date]) groups[t.date] = []; groups[t.date].push(t); });
            const sortedDates = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a));
            if(!sortedDates.length) return `<div class="py-20 text-center opacity-30 text-white"><p class="text-sm font-black uppercase tracking-widest">No entries found</p></div>`;
            return sortedDates.map(date => {
                const daySum = groups[date].reduce((s, t) => s + (t.type === 'income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
                return `<div class="space-y-6"><div class="flex justify-between items-center px-4 text-white"><span class="text-xs font-black text-zinc-600 uppercase tracking-[0.2em]">${new Date(date).toLocaleDateString(undefined, {day:'numeric', month:'short', weekday:'short'})}</span><span class="text-sm font-black ${daySum >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${daySum >= 0 ? '+' : ''}${formatBDT(daySum)}</span></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${groups[date].map(t => `<div onclick="editTransaction(${t.id})" class="premium-card p-7 rounded-[2.5rem] flex items-center justify-between group active:scale-[0.98] cursor-pointer"><div class="flex items-center gap-6"><div class="w-14 h-14 rounded-[1.5rem] bg-zinc-900 border border-white/5 flex items-center justify-center"><i data-lucide="${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-6 h-6 ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}"></i></div><div><p class="text-sm font-black uppercase tracking-wider text-white">${t.category}</p><p class="text-[10px] text-zinc-500 font-bold mt-1">${t.account}</p></div></div><div class="text-right"><p class="text-xl font-black ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${t.type === 'income' ? '+' : '-'}${Number(t.amount).toLocaleString()}</p></div></div>`).join('')}</div></div>`;
            }).join('');
        }

        function renderStats(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const filtered = state.transactions.filter(t => state.statFilter === 'all' || (new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y));
            const currExp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s + parseFloat(t.amount), 0);
            const currInc = filtered.filter(t => t.type === 'income').reduce((s,t) => s + parseFloat(t.amount), 0);
            const expData = {}; filtered.filter(t => t.type === 'expense').forEach(t => { expData[t.category] = (expData[t.category] || 0) + parseFloat(t.amount); });
            const sortedExp = Object.entries(expData).sort((a,b) => b[1]-a[1]);

            el.innerHTML = `
                <div class="space-y-12 pb-28">
                    <div class="flex justify-between items-center px-1"><h2 class="text-3xl font-black tracking-tighter text-white">Insights Hub</h2>
                        <div class="flex bg-zinc-900 p-1.5 rounded-2xl border border-white/5">
                            <button onclick="setStatFilter('monthly')" class="px-8 py-2.5 rounded-xl text-xs font-black uppercase ${state.statFilter === 'monthly' ? 'bg-zinc-800 text-white shadow-lg' : 'text-zinc-600'}">Month</button>
                            <button onclick="setStatFilter('all')" class="px-8 py-2.5 rounded-xl text-xs font-black uppercase ${state.statFilter === 'all' ? 'bg-zinc-800 text-white shadow-lg' : 'text-zinc-600'}">All</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="premium-card p-10 rounded-[2.5rem] text-center"><p class="text-[10px] font-black text-zinc-600 uppercase mb-4 tracking-widest">Savings Rate</p><p class="text-4xl font-black text-emerald-400">${currInc > 0 ? ((currInc-currExp)/currInc*100).toFixed(0) : 0}%</p></div>
                        <div class="premium-card p-10 rounded-[2.5rem] text-center"><p class="text-[10px] font-black text-zinc-600 uppercase mb-4 tracking-widest">Daily Burn</p><p class="text-4xl font-black text-white">৳${Math.round(currExp/30)}</p></div>
                        <div class="premium-card p-10 rounded-[2.5rem] text-center lg:col-span-2 flex flex-col justify-center"><p class="text-[10px] font-black text-zinc-600 uppercase mb-4 tracking-widest">Wealth Velocity</p><p class="text-4xl font-black text-emerald-400">+${formatBDT(currInc-currExp)}</p></div>
                    </div>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        <div class="premium-glass p-12 rounded-[3rem] text-center flex items-center justify-center min-h-[450px]"><div class="h-80 w-full"><canvas id="mainChart"></canvas></div></div>
                        <div class="premium-glass p-12 rounded-[3rem]"><p class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-12">Inflow vs Outflow</p><div class="h-80"><canvas id="barChart"></canvas></div></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${sortedExp.map(([cat, val], idx) => `<div class="premium-card p-8 rounded-[2rem] flex items-center justify-between"><div class="flex items-center gap-4"><div class="w-3 h-3 rounded-full shadow-lg" style="background: ${getPalette(idx)}"></div><span class="text-sm font-black uppercase tracking-widest text-zinc-400">${cat}</span></div><span class="text-lg font-black text-white">${formatBDT(val)}</span></div>`).join('')}
                    </div>
                </div>`;

            setTimeout(() => {
                // Destroy existing chart instances to avoid Canvas reuse errors
                if (chartInstances.mainChart) chartInstances.mainChart.destroy();
                if (chartInstances.barChart) chartInstances.barChart.destroy();

                const ctxD = document.getElementById('mainChart').getContext('2d');
                chartInstances.mainChart = new Chart(ctxD, { type: 'doughnut', data: { labels: Object.keys(expData), datasets: [{ data: Object.values(expData), backgroundColor: Object.keys(expData).map((_, i) => getPalette(i)), borderWidth: 0, hoverOffset: 30 }] }, options: { cutout: '85%', plugins: { legend: { display: false } }, maintainAspectRatio: false } });
                
                const ctxB = document.getElementById('barChart').getContext('2d');
                chartInstances.barChart = new Chart(ctxB, { type: 'bar', data: { labels: ['Income', 'Expense'], datasets: [{ data: [currInc, currExp], backgroundColor: ['#10b981', '#f43f5e'], borderRadius: 20, barThickness: 80 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 14, weight: '800' } } } } } });
            }, 100);
        }

        function renderNotes(el) {
            el.innerHTML = `<div class="space-y-10 text-white pb-28"><div class="flex justify-between items-center px-4"><h2 class="text-3xl font-black tracking-tighter">Finance Memos</h2><button onclick="addNote()" class="p-4 premium-glass rounded-2xl text-emerald-400 hover:scale-105 transition-all"><i data-lucide="plus-square" class="w-8 h-8"></i></button></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${state.notes.length ? state.notes.map(n => `<div class="premium-card p-10 rounded-[3rem] relative group"><textarea onchange="updateNote('${n.id}', this.value)" class="w-full bg-transparent text-xl text-zinc-300 font-medium resize-none min-h-[220px] border-none noscroll" placeholder="Write a reminder...">${n.text}</textarea><div class="flex justify-between items-center mt-10 pt-8 border-t border-white/5"><span class="text-[10px] font-black text-zinc-600 uppercase tracking-widest">${n.date}</span><button onclick="deleteNote('${n.id}')" class="text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity p-2"><i data-lucide="trash-2" class="w-6 h-6"></i></button></div></div>`).join('') : '<div class="col-span-full py-40 text-center opacity-30 text-xl font-black uppercase tracking-widest">Memo board is empty</div>'}</div></div>`;
            lucide.createIcons();
        }

        function renderSettings(el) {
            el.innerHTML = `
                <div class="space-y-12 pb-28">
                    <div class="flex justify-between items-center px-4"><h2 class="text-3xl font-black tracking-tighter text-white">System Config</h2><button onclick="toggleModal('entity-modal', true)" class="bg-zinc-800 px-8 py-4 rounded-2xl text-xs font-black uppercase tracking-widest shadow-xl">+ Add Entity</button></div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        <div class="space-y-6">
                            ${renderFolder('Expense Categories', state.categories.filter(c => c.type === 'expense'), 'cat')}
                            ${renderFolder('Income Categories', state.categories.filter(c => c.type === 'income'), 'cat')}
                            ${renderFolder('Debts & Loans', state.debts, 'debt')}
                            ${renderFolder('Financial Accounts', state.accounts, 'acc')}
                        </div>
                        <div class="space-y-10">
                            <section class="grid grid-cols-2 gap-6"><button onclick="exportCSV()" class="premium-glass p-12 rounded-[3rem] flex flex-col items-center gap-6 hover:bg-white/5 transition-all"><i data-lucide="download-cloud" class="w-10 h-10 text-emerald-500"></i><span class="text-xs font-black uppercase tracking-widest text-white">Backup CSV</span></button><button onclick="document.getElementById('csv-upload-field').click()" class="premium-glass p-12 rounded-[3rem] flex flex-col items-center gap-6 hover:bg-white/5 transition-all"><i data-lucide="upload-cloud" class="w-10 h-10 text-blue-500"></i><span class="text-xs font-black uppercase tracking-widest text-white">Restore CSV</span></button></section>
                            <button onclick="switchTab('calculator')" class="w-full premium-glass py-12 rounded-[3rem] text-sm font-black uppercase tracking-[0.2em] text-zinc-400 flex items-center justify-center gap-6 hover:bg-white/5 transition-all"><i data-lucide="calculator" class="w-8 h-8"></i> Utility Tool</button>
                            <button onclick="toggleModal('purge-modal', true)" class="w-full bg-rose-600/10 border border-rose-500/10 py-10 rounded-[3rem] text-rose-500 text-xs font-black uppercase tracking-[0.4em] hover:bg-rose-600 hover:text-white transition-all">Destroy Data Vault</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderFolder(title, items, type) {
            return `<div class="premium-glass rounded-[2.5rem] overflow-hidden" id="folder-${title.replace(/\s+/g, '')}"><button onclick="toggleFolder('${title.replace(/\s+/g, '')}')" class="w-full flex items-center justify-between p-10 hover:bg-white/5 transition-colors"><div class="flex items-center gap-8"><i data-lucide="folder" class="w-7 h-7 text-zinc-600"></i><div class="text-left"><p class="text-xl font-black uppercase tracking-wider text-white">${title}</p><p class="text-xs text-zinc-600 font-bold uppercase tracking-widest">${items.length} Tracked</p></div></div><i data-lucide="chevron-down" class="w-6 h-6 text-zinc-800 folder-chevron"></i></button><div class="folder-content"><div class="px-10 pb-10 space-y-4">${items.map(item => `<div class="bg-zinc-900 border border-white/5 p-6 rounded-3xl flex justify-between items-center group"><span class="text-sm font-bold text-zinc-400 uppercase tracking-widest">${item.name}</span><button onclick="deleteEntity('${type}', '${item.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity p-2 hover:bg-rose-500/10 rounded-lg"><i data-lucide="trash-2" class="w-6 h-6 text-rose-500"></i></button></div>`).join('') || '<p class="text-xs text-center text-zinc-800 py-12 uppercase font-black">Empty Folder</p>'}</div></div></div>`;
        }

        function toggleFolder(id) { document.getElementById(`folder-${id}`).classList.toggle('folder-open'); }
        function toggleModal(id, show) { const el = document.getElementById(id); if(el) el.classList.toggle('hidden', !show); if(id === 'transaction-modal') { document.getElementById('btn-delete-trans').classList.toggle('hidden', !state.editingId); if(show) populateSelects(); } if(id === 'entity-modal' && show) populateDebtAccountSelect(); }
        function setTransType(type) { state.transType = type; document.getElementById('btn-exp').className = `flex-1 py-4 rounded-xl text-xs font-black uppercase tracking-widest ${type==='expense'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('btn-inc').className = `flex-1 py-4 rounded-xl text-xs font-black uppercase tracking-widest ${type==='income'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; populateSelects(); }
        function populateSelects() { const cats = [...state.categories.filter(c => c.type === state.transType), ...state.debts.map(d => ({ name: d.name }))]; document.getElementById('t-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); document.getElementById('t-acc').innerHTML = state.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join(''); }
        function populateDebtAccountSelect() { const sel = document.getElementById('setup-debt-account'); if(sel) sel.innerHTML = state.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join(''); }
        function qCalc(val) { if(state.qCalcValue === '0' && !isNaN(val)) state.qCalcValue = val; else state.qCalcValue += val; document.getElementById('quick-calc-display').innerText = state.qCalcValue; }
        function qClear() { state.qCalcValue = '0'; document.getElementById('quick-calc-display').innerText = '0'; }
        function openTransactionModal() { state.editingId = null; qClear(); document.getElementById('modal-title').innerText = "New Record"; document.getElementById('t-note').value = ''; toggleModal('transaction-modal', true); setTransType('expense'); }
        function editTransaction(id) { const t = state.transactions.find(x => x.id === id); if(!t) return; state.editingId = id; state.qCalcValue = t.amount.toString(); state.transType = t.type; toggleModal('transaction-modal', true); document.getElementById('modal-title').innerText = "Edit Record"; document.getElementById('quick-calc-display').innerText = t.amount; document.getElementById('t-date').value = t.date; document.getElementById('t-note').value = t.note || ''; setTransType(t.type); document.getElementById('t-cat').value = t.category; document.getElementById('t-acc').value = t.account; }
        
        // Modal-friendly direct deletion (replacing browser confirm)
        function deleteTrans(id) { 
            if (!id) return;
            state.transactions = state.transactions.filter(t => t.id !== id); 
            saveAll(); 
            toggleModal('transaction-modal', false); 
            renderView(); 
        }

        function saveTransaction() { let amt = 0; try { amt = eval(state.qCalcValue.replace(/[^-+*/.0-9]/g, '')); } catch(e) { return; } if(amt <= 0) return; const entry = { id: state.editingId || Date.now(), amount: Math.abs(parseFloat(amt)), type: state.transType, category: document.getElementById('t-cat').value, account: document.getElementById('t-acc').value, date: document.getElementById('t-date').value, note: document.getElementById('t-note').value }; if(state.editingId) state.transactions = state.transactions.map(x => x.id === state.editingId ? entry : x); else state.transactions.unshift(entry); saveAll(); toggleModal('transaction-modal', false); renderView(); }
        function saveAll() { localStorage.setItem(DB_KEYS.transactions, JSON.stringify(state.transactions)); localStorage.setItem(DB_KEYS.categories, JSON.stringify(state.categories)); localStorage.setItem(DB_KEYS.accounts, JSON.stringify(state.accounts)); localStorage.setItem(DB_KEYS.notes, JSON.stringify(state.notes)); localStorage.setItem(DB_KEYS.budgets, JSON.stringify(state.budgets)); localStorage.setItem(DB_KEYS.debts, JSON.stringify(state.debts)); }
        function addNote() { state.notes.unshift({ id: Date.now().toString(), text: '', date: new Date().toLocaleDateString() }); saveAll(); renderView(); }
        function updateNote(id, val) { const n = state.notes.find(n => n.id === id); if(n) n.text = val; saveAll(); }
        function deleteNote(id) { state.notes = state.notes.filter(n => n.id !== id); saveAll(); renderView(); }
        function finalizePurge() { localStorage.clear(); location.reload(); }
        function toggleDashboard(mode) { state.dashboardMode = mode; renderView(); }
        function setStatFilter(mode) { state.statFilter = mode; renderView(); }
        function changeMonth(dir) { state.viewDate.setMonth(state.viewDate.getMonth() + dir); renderView(); }
        function getPalette(i) { return ['#fb7185', '#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#2dd4bf', '#f472b6'][i % 7]; }
        function deleteEntity(type, id) { if(type === 'cat') state.categories = state.categories.filter(c => c.id !== id); else if(type === 'debt') state.debts = state.debts.filter(d => d.id !== id); else state.accounts = state.accounts.filter(a => a.id !== id); saveAll(); renderView(); }
        function finalizeEntitySetup() { const name = document.getElementById('setup-name').value.trim(); if(!name) return; if(state.setupContext === 'cat') state.categories.push({ id: Date.now().toString(), name, type: state.setupBehavior }); else if(state.setupContext === 'debt') { const bal = parseFloat(document.getElementById('setup-initial-balance').value) || 0; const acc = document.getElementById('setup-debt-account').value; state.debts.push({ id: Date.now().toString(), name, initialBalance: bal }); if(bal > 0) state.transactions.unshift({ id: Date.now() + 1, amount: bal, type: 'income', category: name, account: acc, date: new Date().toISOString().split('T')[0], note: `Loan: ${name}` }); } else state.accounts.push({ id: Date.now().toString(), name }); saveAll(); toggleModal('entity-modal', false); document.getElementById('setup-name').value = ''; renderView(); }
        function setSetupType(ctx) { state.setupContext = ctx; document.getElementById('setup-cat-btn').className = `flex-1 py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='cat'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-acc-btn').className = `flex-1 py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='acc'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-debt-btn').className = `flex-1 py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='debt'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('cat-type-select').classList.toggle('hidden', ctx !== 'cat'); document.getElementById('debt-fields').classList.toggle('hidden', ctx !== 'debt'); }
        function setSetupBehavior(type) { state.setupBehavior = type; document.getElementById('setup-exp-btn').className = `flex-1 py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='expense'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-inc-btn').className = `flex-1 py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='income'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; }
        function renderCalculator(el) { el.innerHTML = `<div class="premium-glass rounded-[3rem] p-16 shadow-2xl max-w-4xl mx-auto"><div class="bg-black/40 p-12 rounded-[2.5rem] mb-12 text-right border border-white/5 h-48 flex flex-col justify-end text-white"><div id="full-calc-display" class="text-7xl font-black font-mono tracking-tighter">${state.fullCalcValue}</div></div><div class="grid grid-cols-4 gap-6 text-white"><button class="calc-key bg-zinc-800/50" onclick="fCalc('AC')">AC</button><button class="calc-key bg-zinc-800/50" onclick="fCalc('DEL')">DEL</button><button class="calc-key bg-zinc-800/50" onclick="fCalc('%')">%</button><button class="calc-key calc-key-op" onclick="fCalc('/')">÷</button><button class="calc-key" onclick="fCalc('7')">7</button><button class="calc-key" onclick="fCalc('8')">8</button><button class="calc-key" onclick="fCalc('9')">9</button><button class="calc-key calc-key-op" onclick="fCalc('*')">×</button><button class="calc-key" onclick="fCalc('4')">4</button><button class="calc-key" onclick="fCalc('5')">5</button><button class="calc-key" onclick="fCalc('6')">6</button><button class="calc-key calc-key-op" onclick="fCalc('-')">-</button><button class="calc-key" onclick="fCalc('1')">1</button><button class="calc-key" onclick="fCalc('2')">2</button><button class="calc-key" onclick="fCalc('3')">3</button><button class="calc-key calc-key-op" onclick="fCalc('+')">+</button><button class="calc-key col-span-2" onclick="fCalc('0')">0</button><button class="calc-key" onclick="fCalc('.')">.</button><button class="calc-key bg-white text-black" onclick="fCalc('=')">=</button></div></div>`; }
        function fCalc(val) { if(val === 'AC') state.fullCalcValue = '0'; else if(val === 'DEL') state.fullCalcValue = state.fullCalcValue.length > 1 ? state.fullCalcValue.slice(0, -1) : '0'; else if(val === '=') { try { state.fullCalcValue = eval(state.fullCalcValue.replace('×', '*').replace('÷', '/')).toString(); } catch(e) { state.fullCalcValue = 'Error'; } } else { if(state.fullCalcValue === '0' && !isNaN(val)) state.fullCalcValue = val; else state.fullCalcValue += val; } document.getElementById('full-calc-display').innerText = state.fullCalcValue; }
        function handleCSVSelect(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (evt) => { const lines = evt.target.result.split('\n').filter(l => l.trim()); if(lines.length < 2) return; state.csvHeaders = lines[0].split(',').map(h => h.trim().replace(/"/g, '')); state.csvData = lines.slice(1).map(l => l.split(',')); showMappingModal(); }; reader.readAsText(file); }
        function showMappingModal() { const fields = [{ id: 'map-date', label: 'Date' }, { id: 'map-amt', label: 'Amount' }, { id: 'map-cat', label: 'Category' }, { id: 'map-acc', label: 'Account' }, { id: 'map-type', label: 'Type' }, { id: 'map-note', label: 'Memo' }]; const container = document.getElementById('mapping-fields'); container.innerHTML = fields.map(f => `<div><label class="text-xs font-black uppercase text-zinc-500 mb-3 block">${f.label}</label><select id="${f.id}" class="w-full bg-zinc-900 border border-white/5 p-5 rounded-2xl text-sm font-bold text-white"><option value="">-- Ignore --</option>${state.csvHeaders.map((h, i) => `<option value="${i}">${h}</option>`).join('')}</select></div>`).join(''); toggleModal('mapping-modal', true); }
        function finalizeMappingImport() {
            const map = { date: document.getElementById('map-date').value, amt: document.getElementById('map-amt').value, cat: document.getElementById('map-cat').value, acc: document.getElementById('map-acc').value, type: document.getElementById('map-type').value, note: document.getElementById('map-note').value };
            const imported = state.csvData.map(row => {
                if(row.length < state.csvHeaders.length) return null;
                const rawAmt = map.amt !== "" ? row[map.amt] : "0";
                const amt = Math.abs(parseFloat(rawAmt.replace(/[^-0-9.]/g, '')) || 0);
                let type = 'expense';
                if(map.type !== "" && row[map.type]) { type = row[map.type].toLowerCase().includes('inc') ? 'income' : 'expense'; } else if(parseFloat(rawAmt) > 0) { type = 'income'; }
                const catName = map.cat !== "" ? row[map.cat].trim() : 'Uncategorized';
                const accName = map.acc !== "" ? row[map.acc].trim() : 'Cash';
                if (!state.categories.some(c => c.name.toLowerCase() === catName.toLowerCase())) state.categories.push({ id: Date.now() + Math.random(), name: catName, type: type });
                if (!state.accounts.some(a => a.name.toLowerCase() === accName.toLowerCase())) state.accounts.push({ id: Date.now() + Math.random(), name: accName });
                return { id: Date.now() + Math.random(), date: map.date !== "" ? row[map.date] : new Date().toISOString().split('T')[0], type, category: catName, account: accName, amount: amt, note: map.note !== "" ? row[map.note].replace(/"/g, '') : 'Imported' };
            }).filter(x => x);
            state.transactions = [...imported, ...state.transactions];
            saveAll(); toggleModal('mapping-modal', false); renderView();
        }
        function exportCSV() { const h = ['Date','Type','Category','Account','Amount','Note']; const r = state.transactions.map(t => [t.date,t.type,t.category,t.account,t.amount,`"${t.note}"`]); const c = [h, ...r].map(e => e.join(",")).join("\n"); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], { type: 'text/csv' })); a.download = 'khorcha_backup.csv'; a.click(); }
    </script>
</body>
</html>
