<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khorcha - Offline BDT Money Manager</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Khorcha","short_name":"Khorcha","start_url":".","display":"standalone","background_color":"#09090b","theme_color":"#09090b","icons":[{"src":"https://placehold.co/192x192/18181b/ffffff?text=৳","sizes":"192x192","type":"image/png"},{"src":"https://placehold.co/512x512/18181b/ffffff?text=৳","sizes":"512x512","type":"image/png"}]}'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-color: #09090b;
            --surface: #18181b;
            --surface-accent: #27272a;
            --emerald: #10b981;
            --rose: #f43f5e;
            --primary: #ffffff;
        }

        /* Fallback rules to prevent unstyled layout flashes when offline */
        .hidden { display: none !important; }
        
        @media (max-width: 767px) {
            aside { display: none !important; }
            .mobile-nav { display: flex !important; }
        }

        @media (min-width: 768px) {
            aside { display: flex !important; }
            .mobile-nav { display: none !important; }
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: #fafafa;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Full offline styling safety net */
        .premium-glass {
            background: rgba(24, 24, 27, 0.75) !important;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .premium-card {
            background: var(--surface) !important;
            border: 1px solid var(--surface-accent) !important;
            border-radius: 1.75rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-shell {
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
        }

        @media (min-width: 768px) {
            .app-shell {
                display: grid;
                grid-template-columns: clamp(240px, 20vw, 320px) 1fr;
                height: 100vh;
                height: 100dvh;
            }
            .main-scrollable {
                overflow-y: auto;
                scrollbar-width: none;
            }
        }

        .nav-link {
            border: none;
            cursor: pointer;
        }

        .nav-link.active {
            background: white !important;
            color: black !important;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        /* Offline-resilient Keypad */
        .calc-key {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            font-weight: 700;
            transition: all 0.15s ease;
            user-select: none;
            height: clamp(2.75rem, 5vh, 3.75rem);
            font-size: clamp(1rem, 2.5vh, 1.25rem);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
        }
        .calc-key:active { transform: scale(0.92); }

        .calc-key-op {
            background: rgba(255, 255, 255, 0.12);
            color: var(--emerald);
        }

        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .folder-content {
            transition: all 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .folder-open .folder-content {
            max-height: 1000px;
            opacity: 1;
            padding-top: 1rem;
        }
        .folder-chevron { transition: transform 0.3s ease; }
        .folder-open .folder-chevron { transform: rotate(180deg); }

        .animate-in { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .noscroll::-webkit-scrollbar { display: none; }

        /* General form input fixes for offline mode */
        input, select, textarea {
            background-color: #18181b !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body class="h-full bg-[#09090b]">

    <div id="app" class="app-shell">
        
        <!-- SIDEBAR (DESKTOP / TABLET LANDSCAPE) -->
        <aside class="hidden md:flex flex-col justify-between p-6 lg:p-8 border-r border-white/5 bg-[#09090b] sticky top-0 h-screen z-40">
            <div class="space-y-8 lg:space-y-10">
                <div class="px-2">
                    <div class="flex items-center justify-between gap-2">
                        <h1 class="text-2xl lg:text-3xl xl:text-4xl font-extrabold tracking-tighter text-white">Khorcha</h1>
                        <span id="offline-badge-pc" class="hidden px-2 py-0.5 rounded-full text-[8px] lg:text-[9px] font-black uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 whitespace-nowrap">Offline Ready</span>
                    </div>
                    <p id="pc-date" class="text-[10px] lg:text-xs font-black uppercase tracking-[0.25em] text-zinc-600 mt-2"></p>
                </div>

                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" id="pc-nav-dashboard" class="nav-link active w-full flex items-center gap-3 lg:gap-4 px-4 lg:px-6 py-3.5 lg:py-4 rounded-2xl transition-all">
                        <i data-lucide="layout-grid" class="w-5 h-5 shrink-0"></i>
                        <span class="text-xs lg:text-sm font-bold">Dashboard</span>
                    </button>
                    <button onclick="switchTab('budget')" id="pc-nav-budget" class="nav-link w-full flex items-center gap-3 lg:gap-4 px-4 lg:px-6 py-3.5 lg:py-4 rounded-2xl text-zinc-500 hover:text-white transition-all">
                        <i data-lucide="pie-chart" class="w-5 h-5 shrink-0"></i>
                        <span class="text-xs lg:text-sm font-bold">Budget Planner</span>
                    </button>
                    <button onclick="switchTab('stats')" id="pc-nav-stats" class="nav-link w-full flex items-center gap-3 lg:gap-4 px-4 lg:px-6 py-3.5 lg:py-4 rounded-2xl text-zinc-500 hover:text-white transition-all">
                        <i data-lucide="bar-chart-big" class="w-5 h-5 shrink-0"></i>
                        <span class="text-xs lg:text-sm font-bold">Insights</span>
                    </button>
                    <button onclick="switchTab('notes')" id="pc-nav-notes" class="nav-link w-full flex items-center gap-3 lg:gap-4 px-4 lg:px-6 py-3.5 lg:py-4 rounded-2xl text-zinc-500 hover:text-white transition-all">
                        <i data-lucide="sticky-note" class="w-5 h-5 shrink-0"></i>
                        <span class="text-xs lg:text-sm font-bold">Memos</span>
                    </button>
                    <button onclick="switchTab('settings')" id="pc-nav-settings" class="nav-link w-full flex items-center gap-3 lg:gap-4 px-4 lg:px-6 py-3.5 lg:py-4 rounded-2xl text-zinc-500 hover:text-white transition-all">
                        <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
                        <span class="text-xs lg:text-sm font-bold">Settings</span>
                    </button>
                </nav>
            </div>

            <div class="space-y-4 lg:space-y-6">
                <button onclick="openTransactionModal()" class="w-full bg-white text-black font-black py-4 lg:py-5 rounded-2xl shadow-xl hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 lg:gap-3">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="uppercase tracking-widest text-[10px] lg:text-[11px]">Add Transaction</span>
                </button>
                <div class="p-4 lg:p-5 premium-glass rounded-2xl flex items-center gap-3 lg:gap-4">
                    <div class="w-10 h-10 lg:w-12 lg:h-12 rounded-xl bg-gradient-to-tr from-zinc-800 to-zinc-700 flex items-center justify-center shrink-0">
                        <i data-lucide="user" class="w-5 h-5 lg:w-6 lg:h-6 text-zinc-400"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-xs lg:text-sm font-bold text-white truncate">Local User</p>
                        <p class="text-[9px] lg:text-[10px] font-black uppercase text-zinc-600 tracking-widest truncate">Personal Vault</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main class="main-scrollable relative w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 pt-6 sm:pt-8 md:pt-12 lg:pt-16 pb-32 md:pb-16">
                <!-- Mobile Header -->
                <header class="flex md:hidden justify-between items-center mb-6 sm:mb-8">
                    <div>
                        <div class="flex items-center gap-2 sm:gap-3">
                            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tighter text-white">Khorcha</h1>
                            <span id="offline-badge-mobile" class="hidden px-2 py-0.5 rounded-full text-[8px] font-black uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Offline</span>
                        </div>
                        <p id="header-date" class="text-[10px] font-black uppercase tracking-widest text-zinc-500 mt-0.5"></p>
                    </div>
                    <div onclick="switchTab('settings')" class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl premium-glass flex items-center justify-center cursor-pointer active:scale-95 transition-transform">
                        <i data-lucide="user" class="w-5 h-5 sm:w-6 sm:h-6 text-zinc-400"></i>
                    </div>
                </header>

                <div id="main-content" class="animate-in"></div>
            </div>
        </main>

        <!-- MOBILE NAVIGATION (FIXED BOTTOM BAR) -->
        <nav class="mobile-nav flex md:hidden fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-md premium-glass rounded-[2rem] p-1.5 justify-between items-center z-50">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active flex-1 py-3 rounded-2xl flex flex-col items-center gap-1">
                <i data-lucide="layout-grid" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                <span class="text-[8px] font-black uppercase">Home</span>
            </button>
            <button onclick="switchTab('budget')" id="nav-budget" class="nav-link flex-1 py-3 rounded-2xl flex flex-col items-center gap-1 text-zinc-500">
                <i data-lucide="pie-chart" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                <span class="text-[8px] font-black uppercase">Budget</span>
            </button>
            <button onclick="openTransactionModal()" class="flex-1 flex justify-center -translate-y-6 sm:-translate-y-7">
                <div class="w-14 h-14 sm:w-16 sm:h-16 bg-white text-black rounded-full flex items-center justify-center shadow-2xl ring-6 ring-[#09090b] active:scale-90 transition-transform">
                    <i data-lucide="plus" class="w-7 h-7 sm:w-8 sm:h-8"></i>
                </div>
            </button>
            <button onclick="switchTab('notes')" id="nav-notes" class="nav-link flex-1 py-3 rounded-2xl flex flex-col items-center gap-1 text-zinc-500">
                <i data-lucide="sticky-note" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                <span class="text-[8px] font-black uppercase">Memos</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-link flex-1 py-3 rounded-2xl flex flex-col items-center gap-1 text-zinc-500">
                <i data-lucide="settings" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                <span class="text-[8px] font-black uppercase">Setup</span>
            </button>
        </nav>
    </div>

    <!-- TRANSACTION MODAL -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[60] flex items-end md:items-center justify-center hidden p-0 md:p-6">
        <div class="w-full max-w-2xl max-h-[92vh] md:max-h-[88vh] flex flex-col rounded-t-[2.5rem] md:rounded-[2.5rem] bg-[#0A0A0A] border border-white/10 animate-in shadow-2xl overflow-hidden">
            <!-- Modal Header (Sticky Top) -->
            <div class="flex justify-between items-center p-5 sm:p-6 md:p-8 border-b border-white/5 bg-[#0A0A0A] shrink-0">
                <h3 id="modal-title" class="text-xl sm:text-2xl md:text-3xl font-black tracking-tight text-white">Transaction</h3>
                <button onclick="toggleModal('transaction-modal', false)" class="p-2.5 sm:p-3 bg-zinc-900 rounded-2xl text-zinc-400 hover:text-white active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5 sm:w-6 sm:h-6"></i></button>
            </div>
            
            <!-- Modal Body (Scrollable) -->
            <div class="overflow-y-auto noscroll p-5 sm:p-6 md:p-8 space-y-6 sm:space-y-8 flex-1">
                <div class="flex bg-zinc-900 p-1.5 rounded-2xl border border-white/5">
                    <button onclick="setTransType('expense')" id="btn-exp" class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-zinc-800 text-white shadow-lg">Expense</button>
                    <button onclick="setTransType('income')" id="btn-inc" class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest text-zinc-500">Income</button>
                </div>

                <div class="text-center py-6 sm:py-8 md:py-10 premium-glass rounded-[2rem]">
                    <div class="flex items-center justify-center gap-3 sm:gap-4 px-4">
                        <span class="text-2xl sm:text-3xl md:text-4xl font-bold text-zinc-600">৳</span>
                        <div id="quick-calc-display" class="text-4xl sm:text-6xl md:text-7xl font-black font-mono tracking-tighter text-white truncate">0</div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2 sm:gap-3 text-white">
                    <button class="calc-key" onclick="qCalc('7')">7</button>
                    <button class="calc-key" onclick="qCalc('8')">8</button>
                    <button class="calc-key" onclick="qCalc('9')">9</button>
                    <button class="calc-key calc-key-op" onclick="qCalc('/')">÷</button>
                    <button class="calc-key" onclick="qCalc('4')">4</button>
                    <button class="calc-key" onclick="qCalc('5')">5</button>
                    <button class="calc-key" onclick="qCalc('6')">6</button>
                    <button class="calc-key calc-key-op" onclick="qCalc('*')">×</button>
                    <button class="calc-key" onclick="qCalc('1')">1</button>
                    <button class="calc-key" onclick="qCalc('2')">2</button>
                    <button class="calc-key" onclick="qCalc('3')">3</button>
                    <button class="calc-key calc-key-op" onclick="qCalc('-')">-</button>
                    <button class="calc-key" onclick="qCalc('0')">0</button>
                    <button class="calc-key" onclick="qCalc('.')">.</button>
                    <button class="calc-key bg-rose-500/10 text-rose-500" onclick="qClear()">C</button>
                    <button class="calc-key calc-key-op" onclick="qCalc('+')">+</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase text-zinc-500 px-1">Source / Category</label>
                        <select id="t-cat" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white outline-none"></select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase text-zinc-500 px-1">Payment Account</label>
                        <select id="t-acc" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white outline-none"></select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase text-zinc-500 px-1">Transaction Date</label>
                        <input type="date" id="t-date" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase text-zinc-500 px-1">Memo / Note</label>
                        <input type="text" id="t-note" placeholder="What was this for?" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white outline-none">
                    </div>
                </div>
            </div>

            <!-- Modal Action Footer (Sticky Bottom) -->
            <div class="p-5 sm:p-6 md:p-8 border-t border-white/5 bg-[#0A0A0A] flex gap-3 shrink-0">
                <button id="btn-delete-trans" onclick="deleteTrans(state.editingId)" class="hidden bg-rose-500/10 text-rose-500 p-4 sm:p-5 rounded-2xl hover:bg-rose-500 hover:text-white transition-all active:scale-95">
                    <i data-lucide="trash-2" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </button>
                <button onclick="saveTransaction()" class="flex-1 bg-white text-black font-black py-4 sm:py-5 rounded-2xl shadow-2xl hover:bg-zinc-200 active:scale-95 transition-all uppercase tracking-[0.2em] text-xs">Confirm Entry</button>
            </div>
        </div>
    </div>

    <!-- ENTITY MODAL (CATS/ACCS/DEBTS) -->
    <div id="entity-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[70] flex items-center justify-center hidden p-4 sm:p-6">
        <div class="premium-glass w-full max-w-lg rounded-[2.5rem] p-6 sm:p-8 md:p-10 animate-in text-white max-h-[90vh] overflow-y-auto noscroll">
            <h3 id="entity-modal-title" class="text-2xl sm:text-3xl font-black mb-6 sm:mb-8 text-center">New Setup</h3>
            <div class="space-y-6 sm:space-y-8">
                <div>
                    <label class="text-[10px] font-black uppercase text-zinc-500 mb-2 block">Type of Entity</label>
                    <div class="flex bg-zinc-900 p-1.5 rounded-2xl border border-white/5">
                        <button onclick="setSetupType('cat')" id="setup-cat-btn" class="flex-1 py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase bg-zinc-800 shadow-lg">Category</button>
                        <button onclick="setSetupType('acc')" id="setup-acc-btn" class="flex-1 py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase text-zinc-500">Account</button>
                        <button onclick="setSetupType('debt')" id="setup-debt-btn" class="flex-1 py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase text-zinc-500">Debt</button>
                    </div>
                </div>
                
                <div id="cat-type-select" class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-zinc-500 block">Category Behavior</label>
                    <div class="flex bg-zinc-900 p-1.5 rounded-2xl border border-white/5">
                        <button onclick="setSetupBehavior('expense')" id="setup-exp-btn" class="flex-1 py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase bg-zinc-800 shadow-lg">Expense</button>
                        <button onclick="setSetupBehavior('income')" id="setup-inc-btn" class="flex-1 py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase text-zinc-500">Income</button>
                    </div>
                </div>

                <div id="debt-fields" class="hidden space-y-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-zinc-500 mb-2 block">Total Amount Owed</label>
                        <input type="number" id="setup-initial-balance" placeholder="0.00" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-zinc-500 mb-2 block">Account Credited</label>
                        <select id="setup-debt-account" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white"></select>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-zinc-500 mb-2 block">Name / Identifier</label>
                    <input type="text" id="setup-name" placeholder="e.g. Health Insurance" class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-xs sm:text-sm font-bold text-white">
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button onclick="toggleModal('entity-modal', false)" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-zinc-500">Discard</button>
                    <button onclick="finalizeEntitySetup()" class="flex-1 bg-white text-black rounded-2xl py-4 text-xs font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-transform">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAPPING MODAL -->
    <div id="mapping-modal" class="fixed inset-0 bg-black/98 backdrop-blur-xl z-[80] flex items-center justify-center hidden p-4 sm:p-6">
        <div class="premium-glass w-full max-w-xl rounded-[2.5rem] p-6 sm:p-8 md:p-10 animate-in">
            <h3 class="text-2xl sm:text-3xl font-black mb-2 text-white">Field Linker</h3>
            <p class="text-[10px] sm:text-xs text-zinc-500 font-bold uppercase tracking-widest mb-8">Synchronize CSV Columns to Khorcha</p>
            <div id="mapping-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mb-8 text-white"></div>
            <div class="flex gap-4">
                <button onclick="toggleModal('mapping-modal', false)" class="flex-1 py-4 text-xs font-black uppercase text-zinc-500">Cancel</button>
                <button onclick="finalizeMappingImport()" class="flex-1 bg-white text-black rounded-2xl py-4 text-xs font-black uppercase shadow-2xl">Start Import</button>
            </div>
        </div>
    </div>

    <!-- PURGE MODAL -->
    <div id="purge-modal" class="fixed inset-0 bg-black/98 z-[100] flex items-center justify-center hidden p-6">
        <div class="premium-glass w-full max-w-sm rounded-[2.5rem] p-8 sm:p-10 text-center text-white">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="alert-octagon" class="w-8 h-8 sm:w-10 sm:h-10 text-rose-500"></i></div>
            <h3 class="text-2xl font-black mb-3">Hard Reset?</h3>
            <p class="text-[10px] sm:text-xs text-zinc-500 font-bold uppercase tracking-widest leading-relaxed">Erases all entries and configurations from this device forever.</p>
            <div class="mt-8 flex flex-col gap-3">
                <button onclick="toggleModal('purge-modal', false)" class="w-full py-4 text-xs font-black uppercase tracking-widest text-white">Nevermind</button>
                <button onclick="finalizePurge()" class="w-full bg-rose-600 text-white rounded-2xl py-4 text-xs font-black uppercase shadow-2xl">Clear All Data</button>
            </div>
        </div>
    </div>

    <input type="file" id="csv-upload-field" class="hidden" accept=".csv" onchange="handleCSVSelect(event)">

    <script>
        const DB_KEYS = {
            transactions: 'khorcha_app_v11_trans',
            categories: 'khorcha_app_v11_cats',
            accounts: 'khorcha_app_v11_accs',
            debts: 'khorcha_app_v11_debts',
            budgets: 'khorcha_app_v11_budgets',
            notes: 'khorcha_app_v11_notes'
        };

        // Automatic Data Migration & Recovery
        function restoreAndMigrateAllData() {
            const mappings = [
                { target: DB_KEYS.transactions, legacy: ['khorcha_app_v11_trans', 'khorcha_app_v10_trans', 'k_v9_trans', 'k_v8_trans', 'k_v7_trans', 'khorcha_trans'] },
                { target: DB_KEYS.categories, legacy: ['khorcha_app_v11_cats', 'khorcha_app_v10_cats', 'k_v8_cats', 'k_v7_cats', 'khorcha_cats'] },
                { target: DB_KEYS.accounts, legacy: ['khorcha_app_v11_accs', 'khorcha_app_v10_accs', 'k_v8_accs', 'k_v7_accs', 'khorcha_accs'] },
                { target: DB_KEYS.debts, legacy: ['khorcha_app_v11_debts', 'khorcha_app_v10_debts', 'k_v9_debts', 'khorcha_debts'] },
                { target: DB_KEYS.budgets, legacy: ['khorcha_app_v11_budgets', 'khorcha_app_v10_budgets', 'k_v9_budgets', 'k_v8_budgets', 'khorcha_budgets'] },
                { target: DB_KEYS.notes, legacy: ['khorcha_app_v11_notes', 'khorcha_app_v10_notes', 'k_v9_notes', 'k_v8_notes', 'khorcha_notes'] }
            ];

            mappings.forEach(m => {
                const currentVal = localStorage.getItem(m.target);
                if (!currentVal || currentVal === '[]' || currentVal === '{}') {
                    for (let oldKey of m.legacy) {
                        const oldVal = localStorage.getItem(oldKey);
                        if (oldVal && oldVal !== '[]' && oldVal !== '{}') {
                            localStorage.setItem(m.target, oldVal);
                            break;
                        }
                    }
                }
            });
        }

        restoreAndMigrateAllData();

        let state = {
            transactions: JSON.parse(localStorage.getItem(DB_KEYS.transactions)) || [],
            categories: JSON.parse(localStorage.getItem(DB_KEYS.categories)) || [
                { id: '1', name: 'Food & Dining', type: 'expense' },
                { id: '2', name: 'Transport', type: 'expense' },
                { id: '3', name: 'Primary Salary', type: 'income' }
            ],
            accounts: JSON.parse(localStorage.getItem(DB_KEYS.accounts)) || [
                { id: '1', name: 'Cash' },
                { id: '2', name: 'Main Bank' }
            ],
            debts: JSON.parse(localStorage.getItem(DB_KEYS.debts)) || [],
            budgets: JSON.parse(localStorage.getItem(DB_KEYS.budgets)) || {}, 
            notes: JSON.parse(localStorage.getItem(DB_KEYS.notes)) || [],
            viewDate: new Date(),
            dashboardMode: 'monthly',
            currentTab: 'dashboard',
            statFilter: 'monthly',
            qCalcValue: '0',
            fullCalcValue: '0',
            transType: 'expense',
            setupContext: 'cat',
            setupBehavior: 'expense',
            editingId: null
        };

        let chartInstances = {};

        window.onload = () => { 
            registerOfflineServiceWorker();
            renderView(); 
            updateHeaderDates(); 
            lucide.createIcons(); 
            document.getElementById('t-date').valueAsDate = new Date(); 
        };

        function registerOfflineServiceWorker() {
            const isSupportedProtocol = (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
            const isBlobUrl = window.location.href.startsWith('blob:');

            if ('serviceWorker' in navigator && isSupportedProtocol && !isBlobUrl) {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => {
                        const showBadges = () => {
                            document.getElementById('offline-badge-pc')?.classList.remove('hidden');
                            document.getElementById('offline-badge-mobile')?.classList.remove('hidden');
                        };
                        if (reg.active) showBadges();
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showBadges();
                                }
                            };
                        };
                    })
                    .catch((err) => console.warn('Service Worker note:', err));
            }
        }

        function updateHeaderDates() { 
            const dStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            if(document.getElementById('header-date')) document.getElementById('header-date').innerText = dStr; 
            if(document.getElementById('pc-date')) document.getElementById('pc-date').innerText = dStr; 
        }

        function formatBDT(num) { return '৳' + Number(Math.round(num)).toLocaleString('en-IN', { minimumFractionDigits: 0 }); }

        function switchTab(tab) {
            state.currentTab = tab;
            renderView();
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const mobileBtn = document.getElementById(`nav-${tab}`);
            const pcBtn = document.getElementById(`pc-nav-${tab}`);
            if(mobileBtn) mobileBtn.classList.add('active');
            if(pcBtn) pcBtn.classList.add('active');
        }

        function renderView() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'budget': renderBudget(container); break;
                case 'stats': renderStats(container); break;
                case 'notes': renderNotes(container); break;
                case 'calculator': renderCalculator(container); break;
                case 'settings': renderSettings(container); break;
            }
            lucide.createIcons();
        }

        function renderDashboard(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const filtered = state.transactions.filter(t => state.dashboardMode === 'all' || (new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y));
            let periodInc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            let periodExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            let totalBal = state.transactions.reduce((s, t) => t.type === 'income' ? s + parseFloat(t.amount) : s - parseFloat(t.amount), 0);

            el.innerHTML = `
                <div class="premium-glass rounded-[2rem] sm:rounded-[2.5rem] md:rounded-[3rem] p-6 sm:p-8 md:p-12 lg:p-16 mb-8 sm:mb-12 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-8 sm:mb-12 md:mb-16 relative z-10">
                        <div class="flex bg-black/40 p-1 sm:p-1.5 rounded-full border border-white/5">
                            <button onclick="toggleDashboard('monthly')" class="px-4 sm:px-6 py-1.5 sm:py-2 rounded-full text-[9px] sm:text-[10px] font-black uppercase ${state.dashboardMode === 'monthly' ? 'bg-white text-black shadow-xl' : 'text-zinc-500'}">Month</button>
                            <button onclick="toggleDashboard('all')" class="px-4 sm:px-6 py-1.5 sm:py-2 rounded-full text-[9px] sm:text-[10px] font-black uppercase ${state.dashboardMode === 'all' ? 'bg-white text-black shadow-xl' : 'text-zinc-500'}">Lifetime</button>
                        </div>
                        ${state.dashboardMode === 'monthly' ? `<div class="flex items-center gap-3 sm:gap-6"><button onclick="changeMonth(-1)" class="p-1.5 sm:p-2 text-white hover:bg-white/5 rounded-full"><i data-lucide="chevron-left" class="w-5 h-5 sm:w-6 sm:h-6"></i></button><span class="text-xs font-black uppercase text-zinc-400">${state.viewDate.toLocaleString('default', { month: 'short', year: 'numeric' })}</span><button onclick="changeMonth(1)" class="p-1.5 sm:p-2 text-white hover:bg-white/5 rounded-full"><i data-lucide="chevron-right" class="w-5 h-5 sm:w-6 sm:h-6"></i></button></div>` : ''}
                    </div>

                    <div class="text-center relative z-10 mb-8 sm:mb-12 md:mb-16">
                        <p class="text-zinc-500 text-[10px] sm:text-xs font-black uppercase tracking-[0.3em] mb-2 sm:mb-4">Account Liquidity</p>
                        <h2 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tighter text-white drop-shadow-2xl">${formatBDT(totalBal)}</h2>
                        <p class="mt-4 sm:mt-6 text-xs sm:text-sm font-bold text-zinc-600 uppercase tracking-widest">Period Cashflow: ${formatBDT(periodInc - periodExp)}</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 relative z-10">
                        <div class="bg-emerald-500/5 p-5 sm:p-6 md:p-8 rounded-[1.75rem] sm:rounded-[2.5rem] border border-emerald-500/10"><p class="text-[9px] sm:text-[10px] text-emerald-500/60 font-black mb-1 sm:mb-2 uppercase tracking-widest">Total Received</p><p class="text-2xl sm:text-3xl font-black text-emerald-400">+${formatBDT(periodInc)}</p></div>
                        <div class="bg-rose-500/5 p-5 sm:p-6 md:p-8 rounded-[1.75rem] sm:rounded-[2.5rem] border border-rose-500/10"><p class="text-[9px] sm:text-[10px] text-rose-500/60 font-black mb-1 sm:mb-2 uppercase tracking-widest">Total Spent</p><p class="text-2xl sm:text-3xl font-black text-rose-400">-${formatBDT(periodExp)}</p></div>
                    </div>
                </div>

                <div class="space-y-6 sm:space-y-8 md:space-y-12">
                    <h3 class="text-lg sm:text-xl font-black tracking-tight text-zinc-400 px-1">Recent Timeline</h3>
                    <div class="grid grid-cols-1 gap-8 sm:gap-12">${renderGroupedList(filtered)}</div>
                </div>
            `;
        }

        function renderBudget(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const monthKey = `${m}-${y}`;
            const monthBudgets = state.budgets[monthKey] || {};
            const monthName = state.viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const currentMonthTrans = state.transactions.filter(t => new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y);
            const incomeCats = state.categories.filter(c => c.type === 'income');
            const expenseCats = state.categories.filter(c => c.type === 'expense');
            const debtCats = state.debts;

            let totalPlInc = incomeCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlExp = expenseCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlDebt = debtCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            const rem = totalPlInc - totalPlExp - totalPlDebt;

            el.innerHTML = `
                <div class="space-y-8 sm:space-y-12 pb-20">
                    <div class="premium-glass rounded-[2rem] sm:rounded-[3rem] p-8 sm:p-12 md:p-16">
                        <div class="flex justify-between items-center mb-8 sm:mb-12">
                            <h2 class="text-2xl sm:text-3xl font-black tracking-tighter text-white">Monthly Plan</h2>
                            <div class="flex items-center gap-3 sm:gap-6"><button onclick="changeMonth(-1)" class="p-1.5 sm:p-2 text-white"><i data-lucide="chevron-left" class="w-5 h-5 sm:w-6 sm:h-6"></i></button><span class="text-xs font-black uppercase text-zinc-500">${monthName}</span><button onclick="changeMonth(1)" class="p-1.5 sm:p-2 text-white"><i data-lucide="chevron-right" class="w-5 h-5 sm:w-6 sm:h-6"></i></button></div>
                        </div>
                        <div class="text-center">
                            <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.3em] mb-3 sm:mb-4">Left to Allocate</p>
                            <h2 id="budget-summary-val" class="text-4xl sm:text-6xl font-black tracking-tighter ${rem === 0 ? 'text-emerald-400' : 'text-white'}">${formatBDT(rem)}</h2>
                            <p id="budget-summary-hint" class="text-[10px] sm:text-xs font-bold text-zinc-600 mt-4 sm:mt-6 tracking-widest uppercase">${rem === 0 ? "Every Taka has a job!" : "Goal: Bring this to zero."}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-8 sm:gap-12">
                        <section class="space-y-4 sm:space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-emerald-500/60 px-2 sm:px-4">Income Streams</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${incomeCats.map(c => renderBudgetItem(c, monthBudgets[c.id], currentMonthTrans)).join('')}</div>
                        </section>
                        <section class="space-y-4 sm:space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-rose-500/60 px-2 sm:px-4">Debt Clearance</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${debtCats.map(d => renderDebtBudgetItem(d, monthBudgets[d.id], state.transactions)).join('')}</div>
                        </section>
                        <section class="space-y-4 sm:space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-zinc-500 px-2 sm:px-4">Spending Groups</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${expenseCats.map(c => renderBudgetItem(c, monthBudgets[c.id], currentMonthTrans)).join('')}</div>
                        </section>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderBudgetItem(cat, planned, trans) {
            const isInc = cat.type === 'income';
            const act = trans.filter(t => t.category === cat.name).reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            const plVal = parseFloat(planned) || 0;
            const diff = plVal - act;
            const progress = plVal > 0 ? Math.min((act / plVal) * 100, 100) : 0;
            let barCol = isInc ? (act >= plVal ? 'bg-emerald-400' : 'bg-zinc-700') : (act > plVal ? 'bg-rose-400' : 'bg-white');

            return `
                <div class="premium-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
                    <div class="flex justify-between items-start mb-6 sm:mb-8 gap-2">
                        <div class="overflow-hidden">
                            <p class="text-xs sm:text-sm font-black uppercase tracking-wider text-white truncate">${cat.name}</p>
                            <p id="rem-val-${cat.id}" class="text-[9px] sm:text-[10px] text-zinc-500 font-bold uppercase mt-1.5 sm:mt-2 truncate">${isInc ? (diff > 0 ? 'To Receive' : 'Surplus') : (diff >= 0 ? 'Remaining' : 'Overspent')}: ${formatBDT(Math.abs(diff))}</p>
                        </div>
                        <div class="bg-black/40 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl border border-white/5 shrink-0"><input type="number" value="${planned || ''}" placeholder="0" oninput="updateBudget('${cat.id}', this.value)" class="bg-transparent text-xs sm:text-sm font-black text-white w-16 sm:w-20 text-right outline-none"></div>
                    </div>
                    <div class="progress-bar mb-3"><div id="prog-val-${cat.id}" class="progress-fill ${barCol}" style="width: ${progress}%"></div></div>
                    <div class="flex justify-between items-center text-[8px] sm:text-[9px] font-black uppercase tracking-widest text-zinc-600"><span>${isInc ? 'Got' : 'Used'}: ${formatBDT(act)}</span><span id="plan-val-${cat.id}">Plan: ${formatBDT(plVal)}</span></div>
                </div>
            `;
        }

        function updateBudget(catId, val) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const monthKey = `${m}-${y}`;
            if (!state.budgets[monthKey]) state.budgets[monthKey] = {};
            state.budgets[monthKey][catId] = val;
            saveAll();

            const monthBudgets = state.budgets[monthKey];
            const incomeCats = state.categories.filter(c => c.type === 'income');
            const expenseCats = state.categories.filter(c => c.type === 'expense');
            const debtCats = state.debts;

            let totalPlInc = incomeCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlExp = expenseCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            let totalPlDebt = debtCats.reduce((s, c) => s + (parseFloat(monthBudgets[c.id]) || 0), 0);
            const rem = totalPlInc - totalPlExp - totalPlDebt;

            const summaryEl = document.getElementById('budget-summary-val');
            const hintEl = document.getElementById('budget-summary-hint');
            if (summaryEl) {
                summaryEl.innerText = formatBDT(rem);
                summaryEl.className = `text-4xl sm:text-6xl font-black tracking-tighter ${rem === 0 ? 'text-emerald-400' : 'text-white'}`;
            }
            if (hintEl) {
                hintEl.innerText = rem === 0 ? "Every Taka has a job!" : "Goal: Bring this to zero.";
            }
        }

        function renderDebtBudgetItem(debt, planned, allTrans) {
            const totalPaid = allTrans.filter(t => t.category === debt.name && t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
            const remaining = Math.max(0, parseFloat(debt.initialBalance) - totalPaid);
            return `
                <div class="premium-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
                    <div class="flex justify-between items-start mb-6 sm:mb-8 gap-2">
                        <div class="overflow-hidden"><p class="text-xs sm:text-sm font-black uppercase tracking-widest text-white truncate">${debt.name}</p><p class="text-[9px] sm:text-[10px] text-rose-400/60 font-bold uppercase mt-1.5 sm:mt-2 truncate">Still Owed: ${formatBDT(remaining)}</p></div>
                        <div class="bg-black/40 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl border border-white/5 shrink-0"><input type="number" value="${planned || ''}" placeholder="0" oninput="updateBudget('${debt.id}', this.value)" class="bg-transparent text-xs sm:text-sm font-black text-white w-16 sm:w-20 text-right outline-none"></div>
                    </div>
                    <div class="progress-bar mb-3"><div class="progress-fill bg-rose-400" style="width: ${Math.min((totalPaid / debt.initialBalance) * 100, 100)}%"></div></div>
                    <div class="flex justify-between items-center text-[8px] sm:text-[9px] font-black uppercase tracking-widest text-zinc-600"><span>Cleared: ${formatBDT(totalPaid)}</span><span>Goal: ${formatBDT(parseFloat(planned)||0)}</span></div>
                </div>
            `;
        }

        function renderGroupedList(list) {
            const groups = {}; list.forEach(t => { if(!groups[t.date]) groups[t.date] = []; groups[t.date].push(t); });
            const sortedDates = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a));
            if(!sortedDates.length) return `<div class="py-16 sm:py-20 text-center opacity-30 text-white"><p class="text-xs sm:text-sm font-black uppercase tracking-widest">No entries found</p></div>`;
            return sortedDates.map(date => {
                const daySum = groups[date].reduce((s, t) => s + (t.type === 'income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
                return `<div class="space-y-4 sm:space-y-6"><div class="flex justify-between items-center px-2 sm:px-4 text-white"><span class="text-[10px] sm:text-xs font-black text-zinc-600 uppercase tracking-[0.2em]">${new Date(date).toLocaleDateString(undefined, {day:'numeric', month:'short', weekday:'short'})}</span><span class="text-xs sm:text-sm font-black ${daySum >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${daySum >= 0 ? '+' : ''}${formatBDT(daySum)}</span></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${groups[date].map(t => `<div onclick="editTransaction(${t.id})" class="premium-card p-5 sm:p-7 rounded-[2rem] sm:rounded-[2.5rem] flex items-center justify-between group active:scale-[0.98] cursor-pointer"><div class="flex items-center gap-4 sm:gap-6 overflow-hidden"><div class="w-12 h-12 sm:w-14 sm:h-14 rounded-[1.25rem] sm:rounded-[1.5rem] bg-zinc-900 border border-white/5 flex items-center justify-center shrink-0"><i data-lucide="${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5 sm:w-6 sm:h-6 ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}"></i></div><div class="overflow-hidden"><p class="text-xs sm:text-sm font-black uppercase tracking-wider text-white truncate">${t.category}</p><p class="text-[9px] sm:text-[10px] text-zinc-500 font-bold mt-0.5 sm:mt-1 truncate">${t.account}</p></div></div><div class="text-right shrink-0"><p class="text-base sm:text-xl font-black ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${t.type === 'income' ? '+' : '-'}${Number(t.amount).toLocaleString()}</p></div></div>`).join('')}</div></div>`;
            }).join('');
        }

        function renderStats(el) {
            const m = state.viewDate.getMonth(), y = state.viewDate.getFullYear();
            const filtered = state.transactions.filter(t => state.statFilter === 'all' || (new Date(t.date).getMonth() === m && new Date(t.date).getFullYear() === y));
            const currExp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s + parseFloat(t.amount), 0);
            const currInc = filtered.filter(t => t.type === 'income').reduce((s,t) => s + parseFloat(t.amount), 0);
            const expData = {}; filtered.filter(t => t.type === 'expense').forEach(t => { expData[t.category] = (expData[t.category] || 0) + parseFloat(t.amount); });
            const sortedExp = Object.entries(expData).sort((a,b) => b[1]-a[1]);

            el.innerHTML = `
                <div class="space-y-8 sm:space-y-12 pb-28">
                    <div class="flex justify-between items-center px-1"><h2 class="text-2xl sm:text-3xl font-black tracking-tighter text-white">Insights Hub</h2>
                        <div class="flex bg-zinc-900 p-1.5 rounded-2xl border border-white/5">
                            <button onclick="setStatFilter('monthly')" class="px-5 sm:px-8 py-2 sm:py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase ${state.statFilter === 'monthly' ? 'bg-zinc-800 text-white shadow-lg' : 'text-zinc-600'}">Month</button>
                            <button onclick="setStatFilter('all')" class="px-5 sm:px-8 py-2 sm:py-2.5 rounded-xl text-[10px] sm:text-xs font-black uppercase ${state.statFilter === 'all' ? 'bg-zinc-800 text-white shadow-lg' : 'text-zinc-600'}">All</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div class="premium-card p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] text-center"><p class="text-[9px] sm:text-[10px] font-black text-zinc-600 uppercase mb-2 sm:mb-4 tracking-widest">Savings Rate</p><p class="text-3xl sm:text-4xl font-black text-emerald-400">${currInc > 0 ? ((currInc-currExp)/currInc*100).toFixed(0) : 0}%</p></div>
                        <div class="premium-card p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] text-center"><p class="text-[9px] sm:text-[10px] font-black text-zinc-600 uppercase mb-2 sm:mb-4 tracking-widest">Daily Burn</p><p class="text-3xl sm:text-4xl font-black text-white">৳${Math.round(currExp/30)}</p></div>
                        <div class="premium-card p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] text-center sm:col-span-2 flex flex-col justify-center"><p class="text-[9px] sm:text-[10px] font-black text-zinc-600 uppercase mb-2 sm:mb-4 tracking-widest">Wealth Velocity</p><p class="text-3xl sm:text-4xl font-black text-emerald-400">+${formatBDT(currInc-currExp)}</p></div>
                    </div>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-10">
                        <div class="premium-glass p-6 sm:p-12 rounded-[2.5rem] sm:rounded-[3rem] text-center flex items-center justify-center min-h-[320px] sm:min-h-[420px]"><div class="h-64 sm:h-80 w-full"><canvas id="mainChart"></canvas></div></div>
                        <div class="premium-glass p-6 sm:p-12 rounded-[2.5rem] sm:rounded-[3rem]"><p class="text-[10px] sm:text-xs font-black text-zinc-500 uppercase tracking-widest mb-8 sm:mb-12">Inflow vs Outflow</p><div class="h-64 sm:h-80"><canvas id="barChart"></canvas></div></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                        ${sortedExp.map(([cat, val], idx) => `<div class="premium-card p-6 sm:p-8 rounded-[1.75rem] sm:rounded-[2rem] flex items-center justify-between"><div class="flex items-center gap-3 sm:gap-4"><div class="w-3 h-3 rounded-full shadow-lg" style="background: ${getPalette(idx)}"></div><span class="text-xs sm:text-sm font-black uppercase tracking-widest text-zinc-400">${cat}</span></div><span class="text-base sm:text-lg font-black text-white">${formatBDT(val)}</span></div>`).join('')}
                    </div>
                </div>`;

            setTimeout(() => {
                if (chartInstances.mainChart) chartInstances.mainChart.destroy();
                if (chartInstances.barChart) chartInstances.barChart.destroy();

                const ctxD = document.getElementById('mainChart').getContext('2d');
                chartInstances.mainChart = new Chart(ctxD, { type: 'doughnut', data: { labels: Object.keys(expData), datasets: [{ data: Object.values(expData), backgroundColor: Object.keys(expData).map((_, i) => getPalette(i)), borderWidth: 0, hoverOffset: 20 }] }, options: { cutout: '82%', plugins: { legend: { display: false } }, maintainAspectRatio: false } });
                
                const ctxB = document.getElementById('barChart').getContext('2d');
                chartInstances.barChart = new Chart(ctxB, { type: 'bar', data: { labels: ['Income', 'Expense'], datasets: [{ data: [currInc, currExp], backgroundColor: ['#10b981', '#f43f5e'], borderRadius: 16 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#71717a', font: { size: 12, weight: '800' } } } } } });
            }, 100);
        }

        function renderNotes(el) {
            el.innerHTML = `<div class="space-y-8 text-white pb-28"><div class="flex justify-between items-center px-2"><h2 class="text-2xl sm:text-3xl font-black tracking-tighter">Finance Memos</h2><button onclick="addNote()" class="p-3 sm:p-4 premium-glass rounded-2xl text-emerald-400 hover:scale-105 transition-all"><i data-lucide="plus-square" class="w-6 h-6 sm:w-8 sm:h-8"></i></button></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">${state.notes.length ? state.notes.map(n => `<div class="premium-card p-6 sm:p-10 rounded-[2.5rem] relative group"><textarea onchange="updateNote('${n.id}', this.value)" class="w-full bg-transparent text-lg sm:text-xl text-zinc-300 font-medium resize-none min-h-[180px] sm:min-h-[220px] border-none noscroll outline-none" placeholder="Write a reminder...">${n.text}</textarea><div class="flex justify-between items-center mt-6 pt-6 border-t border-white/5"><span class="text-[10px] font-black text-zinc-600 uppercase tracking-widest">${n.date}</span><button onclick="deleteNote('${n.id}')" class="text-rose-500 opacity-80 group-hover:opacity-100 transition-opacity p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button></div></div>`).join('') : '<div class="col-span-full py-30 text-center opacity-30 text-base sm:text-xl font-black uppercase tracking-widest">Memo board is empty</div>'}</div></div>`;
            lucide.createIcons();
        }

        function renderSettings(el) {
            el.innerHTML = `
                <div class="space-y-8 sm:space-y-12 pb-28">
                    <div class="flex justify-between items-center px-2"><h2 class="text-2xl sm:text-3xl font-black tracking-tighter text-white">System Config</h2><button onclick="toggleModal('entity-modal', true)" class="bg-zinc-800 px-6 sm:px-8 py-3 sm:py-4 rounded-2xl text-[10px] sm:text-xs font-black uppercase tracking-widest shadow-xl">+ Add Entity</button></div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-10">
                        <div class="space-y-4 sm:space-y-6">
                            ${renderFolder('Expense Categories', state.categories.filter(c => c.type === 'expense'), 'cat')}
                            ${renderFolder('Income Categories', state.categories.filter(c => c.type === 'income'), 'cat')}
                            ${renderFolder('Debts & Loans', state.debts, 'debt')}
                            ${renderFolder('Financial Accounts', state.accounts, 'acc')}
                        </div>
                        <div class="space-y-6 sm:space-y-10">
                            <section class="grid grid-cols-2 gap-4 sm:gap-6"><button onclick="exportCSV()" class="premium-glass p-8 sm:p-12 rounded-[2rem] sm:rounded-[3rem] flex flex-col items-center gap-4 sm:gap-6 hover:bg-white/5 transition-all"><i data-lucide="download-cloud" class="w-8 h-8 sm:w-10 sm:h-10 text-emerald-500"></i><span class="text-[10px] sm:text-xs font-black uppercase tracking-widest text-white">Backup CSV</span></button><button onclick="document.getElementById('csv-upload-field').click()" class="premium-glass p-8 sm:p-12 rounded-[2rem] sm:rounded-[3rem] flex flex-col items-center gap-4 sm:gap-6 hover:bg-white/5 transition-all"><i data-lucide="upload-cloud" class="w-8 h-8 sm:w-10 sm:h-10 text-blue-500"></i><span class="text-[10px] sm:text-xs font-black uppercase tracking-widest text-white">Restore CSV</span></button></section>
                            <button onclick="switchTab('calculator')" class="w-full premium-glass py-8 sm:py-12 rounded-[2rem] sm:rounded-[3rem] text-xs sm:text-sm font-black uppercase tracking-[0.2em] text-zinc-400 flex items-center justify-center gap-4 sm:gap-6 hover:bg-white/5 transition-all"><i data-lucide="calculator" class="w-6 h-6 sm:w-8 sm:h-8"></i> Utility Tool</button>
                            <button onclick="toggleModal('purge-modal', true)" class="w-full bg-rose-600/10 border border-rose-500/10 py-6 sm:py-10 rounded-[2rem] sm:rounded-[3rem] text-rose-500 text-[10px] sm:text-xs font-black uppercase tracking-[0.3em] hover:bg-rose-600 hover:text-white transition-all">Destroy Data Vault</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderFolder(title, items, type) {
            return `<div class="premium-glass rounded-[2rem] sm:rounded-[2.5rem] overflow-hidden" id="folder-${title.replace(/\s+/g, '')}"><button onclick="toggleFolder('${title.replace(/\s+/g, '')}')" class="w-full flex items-center justify-between p-6 sm:p-10 hover:bg-white/5 transition-colors"><div class="flex items-center gap-4 sm:gap-8"><i data-lucide="folder" class="w-6 h-6 sm:w-7 sm:h-7 text-zinc-600"></i><div class="text-left"><p class="text-base sm:text-xl font-black uppercase tracking-wider text-white">${title}</p><p class="text-[10px] sm:text-xs text-zinc-600 font-bold uppercase tracking-widest">${items.length} Tracked</p></div></div><i data-lucide="chevron-down" class="w-5 h-5 sm:w-6 sm:h-6 text-zinc-800 folder-chevron"></i></button><div class="folder-content"><div class="px-6 sm:px-10 pb-6 sm:pb-10 space-y-3 sm:space-y-4">${items.map(item => `<div class="bg-zinc-900 border border-white/5 p-4 sm:p-6 rounded-2xl sm:rounded-3xl flex justify-between items-center group"><span class="text-xs sm:text-sm font-bold text-zinc-400 uppercase tracking-widest">${item.name}</span><button onclick="deleteEntity('${type}', '${item.id}')" class="opacity-80 sm:opacity-0 group-hover:opacity-100 transition-opacity p-2 hover:bg-rose-500/10 rounded-lg"><i data-lucide="trash-2" class="w-5 h-5 text-rose-500"></i></button></div>`).join('') || '<p class="text-xs text-center text-zinc-800 py-8 sm:py-12 uppercase font-black">Empty Folder</p>'}</div></div></div>`;
        }

        function toggleFolder(id) { document.getElementById(`folder-${id}`).classList.toggle('folder-open'); }
        function toggleModal(id, show) { const el = document.getElementById(id); if(el) el.classList.toggle('hidden', !show); if(id === 'transaction-modal') { document.getElementById('btn-delete-trans').classList.toggle('hidden', !state.editingId); if(show) populateSelects(); } if(id === 'entity-modal' && show) populateDebtAccountSelect(); }
        function setTransType(type) { state.transType = type; document.getElementById('btn-exp').className = `flex-1 py-3 sm:py-4 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='expense'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('btn-inc').className = `flex-1 py-3 sm:py-4 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='income'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; populateSelects(); }
        function populateSelects() { const cats = [...state.categories.filter(c => c.type === state.transType), ...state.debts.map(d => ({ name: d.name }))]; document.getElementById('t-cat').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); document.getElementById('t-acc').innerHTML = state.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join(''); }
        function populateDebtAccountSelect() { const sel = document.getElementById('setup-debt-account'); if(sel) sel.innerHTML = state.accounts.map(a => `<option value="${a.name}">${a.name}</option>`).join(''); }
        function qCalc(val) { if(state.qCalcValue === '0' && !isNaN(val)) state.qCalcValue = val; else state.qCalcValue += val; document.getElementById('quick-calc-display').innerText = state.qCalcValue; }
        function qClear() { state.qCalcValue = '0'; document.getElementById('quick-calc-display').innerText = '0'; }
        function openTransactionModal() { state.editingId = null; qClear(); document.getElementById('modal-title').innerText = "New Record"; document.getElementById('t-note').value = ''; toggleModal('transaction-modal', true); setTransType('expense'); }
        function editTransaction(id) { const t = state.transactions.find(x => x.id === id); if(!t) return; state.editingId = id; state.qCalcValue = t.amount.toString(); state.transType = t.type; toggleModal('transaction-modal', true); document.getElementById('modal-title').innerText = "Edit Record"; document.getElementById('quick-calc-display').innerText = t.amount; document.getElementById('t-date').value = t.date; document.getElementById('t-note').value = t.note || ''; setTransType(t.type); document.getElementById('t-cat').value = t.category; document.getElementById('t-acc').value = t.account; }
        
        function deleteTrans(id) { 
            if (!id) return;
            state.transactions = state.transactions.filter(t => t.id !== id); 
            saveAll(); 
            toggleModal('transaction-modal', false); 
            renderView(); 
        }

        function saveTransaction() { let amt = 0; try { amt = eval(state.qCalcValue.replace(/[^-+*/.0-9]/g, '')); } catch(e) { return; } if(amt <= 0) return; const entry = { id: state.editingId || Date.now(), amount: Math.abs(parseFloat(amt)), type: state.transType, category: document.getElementById('t-cat').value, account: document.getElementById('t-acc').value, date: document.getElementById('t-date').value, note: document.getElementById('t-note').value }; if(state.editingId) state.transactions = state.transactions.map(x => x.id === state.editingId ? entry : x); else state.transactions.unshift(entry); saveAll(); toggleModal('transaction-modal', false); renderView(); }
        function saveAll() { localStorage.setItem(DB_KEYS.transactions, JSON.stringify(state.transactions)); localStorage.setItem(DB_KEYS.categories, JSON.stringify(state.categories)); localStorage.setItem(DB_KEYS.accounts, JSON.stringify(state.accounts)); localStorage.setItem(DB_KEYS.notes, JSON.stringify(state.notes)); localStorage.setItem(DB_KEYS.budgets, JSON.stringify(state.budgets)); localStorage.setItem(DB_KEYS.debts, JSON.stringify(state.debts)); }
        function addNote() { state.notes.unshift({ id: Date.now().toString(), text: '', date: new Date().toLocaleDateString() }); saveAll(); renderView(); }
        function updateNote(id, val) { const n = state.notes.find(n => n.id === id); if(n) n.text = val; saveAll(); }
        function deleteNote(id) { state.notes = state.notes.filter(n => n.id !== id); saveAll(); renderView(); }
        function finalizePurge() { localStorage.clear(); location.reload(); }
        function toggleDashboard(mode) { state.dashboardMode = mode; renderView(); }
        function setStatFilter(mode) { state.statFilter = mode; renderView(); }
        function changeMonth(dir) { state.viewDate.setMonth(state.viewDate.getMonth() + dir); renderView(); }
        function getPalette(i) { return ['#fb7185', '#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#2dd4bf', '#f472b6'][i % 7]; }
        function deleteEntity(type, id) { if(type === 'cat') state.categories = state.categories.filter(c => c.id !== id); else if(type === 'debt') state.debts = state.debts.filter(d => d.id !== id); else state.accounts = state.accounts.filter(a => a.id !== id); saveAll(); renderView(); }
        function finalizeEntitySetup() { const name = document.getElementById('setup-name').value.trim(); if(!name) return; if(state.setupContext === 'cat') state.categories.push({ id: Date.now().toString(), name, type: state.setupBehavior }); else if(state.setupContext === 'debt') { const bal = parseFloat(document.getElementById('setup-initial-balance').value) || 0; const acc = document.getElementById('setup-debt-account').value; state.debts.push({ id: Date.now().toString(), name, initialBalance: bal }); if(bal > 0) state.transactions.unshift({ id: Date.now() + 1, amount: bal, type: 'income', category: name, account: acc, date: new Date().toISOString().split('T')[0], note: `Loan: ${name}` }); } else state.accounts.push({ id: Date.now().toString(), name }); saveAll(); toggleModal('entity-modal', false); document.getElementById('setup-name').value = ''; renderView(); }
        function setSetupType(ctx) { state.setupContext = ctx; document.getElementById('setup-cat-btn').className = `flex-1 py-2.5 sm:py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='cat'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-acc-btn').className = `flex-1 py-2.5 sm:py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='acc'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-debt-btn').className = `flex-1 py-2.5 sm:py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${ctx==='debt'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('cat-type-select').classList.toggle('hidden', ctx !== 'cat'); document.getElementById('debt-fields').classList.toggle('hidden', ctx !== 'debt'); }
        function setSetupBehavior(type) { state.setupBehavior = type; document.getElementById('setup-exp-btn').className = `flex-1 py-2.5 sm:py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='expense'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; document.getElementById('setup-inc-btn').className = `flex-1 py-2.5 sm:py-3 rounded-xl text-[10px] md:text-xs font-black uppercase tracking-widest ${type==='income'?'bg-zinc-800 text-white shadow-lg':'text-zinc-500'}`; }
        function renderCalculator(el) { el.innerHTML = `<div class="premium-glass rounded-[2.5rem] sm:rounded-[3rem] p-8 sm:p-12 md:p-16 shadow-2xl max-w-4xl mx-auto"><div class="bg-black/40 p-8 sm:p-12 rounded-[2rem] sm:rounded-[2.5rem] mb-8 sm:mb-12 text-right border border-white/5 h-36 sm:h-48 flex flex-col justify-end text-white"><div id="full-calc-display" class="text-4xl sm:text-6xl md:text-7xl font-black font-mono tracking-tighter">${state.fullCalcValue}</div></div><div class="grid grid-cols-4 gap-3 sm:gap-6 text-white"><button class="calc-key bg-zinc-800/50" onclick="fCalc('AC')">AC</button><button class="calc-key bg-zinc-800/50" onclick="fCalc('DEL')">DEL</button><button class="calc-key bg-zinc-800/50" onclick="fCalc('%')">%</button><button class="calc-key calc-key-op" onclick="fCalc('/')">÷</button><button class="calc-key" onclick="fCalc('7')">7</button><button class="calc-key" onclick="fCalc('8')">8</button><button class="calc-key" onclick="fCalc('9')">9</button><button class="calc-key calc-key-op" onclick="fCalc('*')">×</button><button class="calc-key" onclick="fCalc('4')">4</button><button class="calc-key" onclick="fCalc('5')">5</button><button class="calc-key" onclick="fCalc('6')">6</button><button class="calc-key calc-key-op" onclick="fCalc('-')">-</button><button class="calc-key" onclick="fCalc('1')">1</button><button class="calc-key" onclick="fCalc('2')">2</button><button class="calc-key" onclick="fCalc('3')">3</button><button class="calc-key calc-key-op" onclick="fCalc('+')">+</button><button class="calc-key col-span-2" onclick="fCalc('0')">0</button><button class="calc-key" onclick="fCalc('.')">.</button><button class="calc-key bg-white text-black" onclick="fCalc('=')">=</button></div></div>`; }
        function fCalc(val) { if(val === 'AC') state.fullCalcValue = '0'; else if(val === 'DEL') state.fullCalcValue = state.fullCalcValue.length > 1 ? state.fullCalcValue.slice(0, -1) : '0'; else if(val === '=') { try { state.fullCalcValue = eval(state.fullCalcValue.replace('×', '*').replace('÷', '/')).toString(); } catch(e) { state.fullCalcValue = 'Error'; } } else { if(state.fullCalcValue === '0' && !isNaN(val)) state.fullCalcValue = val; else state.fullCalcValue += val; } document.getElementById('full-calc-display').innerText = state.fullCalcValue; }
        function handleCSVSelect(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (evt) => { const lines = evt.target.result.split('\n').filter(l => l.trim()); if(lines.length < 2) return; state.csvHeaders = lines[0].split(',').map(h => h.trim().replace(/"/g, '')); state.csvData = lines.slice(1).map(l => l.split(',')); showMappingModal(); }; reader.readAsText(file); }
        function showMappingModal() { const fields = [{ id: 'map-date', label: 'Date' }, { id: 'map-amt', label: 'Amount' }, { id: 'map-cat', label: 'Category' }, { id: 'map-acc', label: 'Account' }, { id: 'map-type', label: 'Type' }, { id: 'map-note', label: 'Memo' }]; const container = document.getElementById('mapping-fields'); container.innerHTML = fields.map(f => `<div><label class="text-[10px] sm:text-xs font-black uppercase text-zinc-500 mb-2 block">${f.label}</label><select id="${f.id}" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-2xl text-xs sm:text-sm font-bold text-white"><option value="">-- Ignore --</option>${state.csvHeaders.map((h, i) => `<option value="${i}">${h}</option>`).join('')}</select></div>`).join(''); toggleModal('mapping-modal', true); }
        function finalizeMappingImport() {
            const map = { date: document.getElementById('map-date').value, amt: document.getElementById('map-amt').value, cat: document.getElementById('map-cat').value, acc: document.getElementById('map-acc').value, type: document.getElementById('map-type').value, note: document.getElementById('map-note').value };
            const imported = state.csvData.map(row => {
                if(row.length < state.csvHeaders.length) return null;
                const rawAmt = map.amt !== "" ? row[map.amt] : "0";
                const amt = Math.abs(parseFloat(rawAmt.replace(/[^-0-9.]/g, '')) || 0);
                let type = 'expense';
                if(map.type !== "" && row[map.type]) { type = row[map.type].toLowerCase().includes('inc') ? 'income' : 'expense'; } else if(parseFloat(rawAmt) > 0) { type = 'income'; }
                const catName = map.cat !== "" ? row[map.cat].trim() : 'Uncategorized';
                const accName = map.acc !== "" ? row[map.acc].trim() : 'Cash';
                if (!state.categories.some(c => c.name.toLowerCase() === catName.toLowerCase())) state.categories.push({ id: Date.now() + Math.random(), name: catName, type: type });
                if (!state.accounts.some(a => a.name.toLowerCase() === accName.toLowerCase())) state.accounts.push({ id: Date.now() + Math.random(), name: accName });
                return { id: Date.now() + Math.random(), date: map.date !== "" ? row[map.date] : new Date().toISOString().split('T')[0], type, category: catName, account: accName, amount: amt, note: map.note !== "" ? row[map.note].replace(/"/g, '') : 'Imported' };
            }).filter(x => x);
            state.transactions = [...imported, ...state.transactions];
            saveAll(); toggleModal('mapping-modal', false); renderView();
        }
        function exportCSV() { const h = ['Date','Type','Category','Account','Amount','Note']; const r = state.transactions.map(t => [t.date,t.type,t.category,t.account,t.amount,`"${t.note}"`]); const c = [h, ...r].map(e => e.join(",")).join("\n"); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], { type: 'text/csv' })); a.download = 'khorcha_backup.csv'; a.click(); }
    </script>
</body>
</html>
