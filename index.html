<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khorcha - Offline BDT Money Manager</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Khorcha","short_name":"Khorcha","start_url":".","display":"standalone","background_color":"#09090b","theme_color":"#09090b","icons":[{"src":"https://placehold.co/192x192/18181b/ffffff?text=৳","sizes":"192x192","type":"image/png"},{"src":"https://placehold.co/512x512/18181b/ffffff?text=৳","sizes":"512x512","type":"image/png"}]}'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --bg-color: #09090b; --surface: #18181b; --surface-accent: #27272a; --emerald: #10b981; --rose: #f43f5e; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: #fafafa; font-size: 16px; }
        .premium-glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .premium-card { background: var(--surface); border: 1px solid var(--surface-accent); transition: 0.2s; }
        .hidden { display: none !important; }
        .noscroll::-webkit-scrollbar { display: none; }
        .nav-link.active { background: white; color: black; box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1); }
        .calc-key { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 1rem; font-weight: 800; font-size: 1.25rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); height: 3.5rem; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }
        .folder-content { max-height: 0; overflow: hidden; transition: 0.3s; }
        .folder-open .folder-content { max-height: 2000px; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="md:grid md:grid-cols-[300px_1fr] h-screen">
        <aside class="hidden md:flex flex-col justify-between p-8 border-r border-white/5 bg-[#09090b] overflow-y-auto">
            <div class="space-y-12">
                <h1 class="text-4xl font-extrabold tracking-tighter text-white">Khorcha</h1>
                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" class="nav-link active w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all"><i data-lucide="layout-grid"></i><span>Dashboard</span></button>
                    <button onclick="switchTab('budget')" class="nav-link w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-zinc-500 hover:text-white transition-all"><i data-lucide="pie-chart"></i><span>Budget</span></button>
                    <button onclick="switchTab('settings')" class="nav-link w-full flex items-center gap-4 px-6 py-4 rounded-2xl text-zinc-500 hover:text-white transition-all"><i data-lucide="settings"></i><span>Settings</span></button>
                </nav>
            </div>
            <div id="auth-sidebar" class="space-y-4"></div>
        </aside>
        <main class="h-screen overflow-y-auto noscroll p-6 md:p-12">
            <div id="main-content" class="max-w-6xl mx-auto"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3K5XOBKHPutHfnIrzj1utwNfXRMxDSdY",
            authDomain: "khorcha-8a919.firebaseapp.com",
            projectId: "khorcha-8a919",
            storageBucket: "khorcha-8a919.firebasestorage.app",
            messagingSenderId: "1064844835281",
            appId: "1:1064844835281:web:82dc2b5225a301b55048f0",
            measurementId: "G-L62B8CE296"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let data = { transactions: [], categories: [], accounts: [] };

        onAuthStateChanged(auth, (currentUser) => {
            user = currentUser;
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) data = snap.data();
                    renderApp();
                });
            } else {
                renderApp();
            }
        });

        window.signIn = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.signOutUser = () => signOut(auth);

        window.renderApp = () => {
            document.getElementById('main-content').innerHTML = `
                <div class="premium-glass p-10 rounded-[2.5rem]">
                    <h2 class="text-3xl font-bold mb-6">${user ? 'Welcome, ' + user.displayName : 'Dashboard'}</h2>
                    <p class="text-zinc-400">Total Entries: ${data.transactions?.length || 0}</p>
                    ${!user ? 
                        `<button onclick="signIn()" class="mt-6 bg-white text-black px-6 py-3 rounded-xl font-bold">Google Sign In</button>` : 
                        `<button onclick="signOutUser()" class="mt-6 bg-rose-600 text-white px-6 py-3 rounded-xl">Logout</button>`
                    }
                </div>
            `;
            document.getElementById('auth-sidebar').innerHTML = !user ? 
                `<button onclick="signIn()" class="w-full bg-white text-black py-4 rounded-2xl font-bold">Sign In</button>` :
                `<div class="text-white text-xs p-4 bg-zinc-900 rounded-xl">Logged in as ${user.email}</div>`;
            lucide.createIcons();
        };

        window.switchTab = (tab) => console.log(tab);
        window.openTransactionModal = () => {};
        
        renderApp();
        
        if ('serviceWorker' in navigator && !window.location.href.startsWith('blob:')) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
